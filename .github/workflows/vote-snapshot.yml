name: market / vote snapshot

# F2: one Discussion per plugin, 👍 reactions -> one-person-one-vote snapshot.
# Runs on a timer and on demand. The committed data/votes.json is the single
# source for both per-plugin `votes` and index.generatedAt (no drift).
on:
  schedule:
    - cron: '17 */6 * * *'   # every 6 hours
  workflow_dispatch:

permissions:
  contents: write
  discussions: read

concurrency:
  group: market-vote-snapshot
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch Discussion 👍 reactions (one vote per account, age gate)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/vote-snapshot.mjs --min-account-age-days 30

      - name: Rebuild index.json / snapshot.json from votes.json
        run: node scripts/build-index.mjs

      - name: Rebuild static site so the leaderboard shows the same votes
        run: node scripts/build-site.mjs

      - name: Validate the committed dataset (votes contract included)
        run: node scripts/validate.mjs

      - name: Commit refreshed snapshot
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/votes.json data/index.json data/snapshot.json site/index.html
          if git diff --cached --quiet; then
            echo 'vote snapshot unchanged; nothing to commit'
          else
            git commit -m 'chore(f2): refresh discussion vote snapshot'
            git push
          fi
